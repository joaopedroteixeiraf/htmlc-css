<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colgrup</title>

    <style>
        table {
            font-family: Arial, Helvetica, sans-serif;
        }

        th, td {
           border: 1px solid black;
           padding: 10px; 
        }

        col.cnome {
            background-color: aqua;
        }

        col.csexo {
            background-color: red;
        }

        col.cidade {
            background-color: greenyellow;
        }

        col.cprof {
            background-color: blueviolet;
        }

    </style>
</head>
<body>
    <table>

        <colgroup>
            <col class="cnome"> 
            <col class="csexo">
            <col class="cidade">
            <col class="cprof">
        </colgroup>

        <thead>
            <tr>
                <td>Nome</td>
                <td>Sexo</td>
                <td>Idade</td>
                <td>Profissão</td>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Márcia</td>
                <td>Fem</td>
                <td>52</td>
                <td>Empresária</td>
            </tr>

            <tr>
                <td>Rodney</td>
                <td>Masc</td>
                <td>56</td>
                <td>Aposentado</td>
            </tr>

            <tr>
                <td>Rayanne</td>
                <td>Fem</td>
                <td>30</td>
                <td>Dentista</td>
            </tr>

            <tr>
                <td>Diego</td>
                <td>Masc</td>
                <td>32</td>
                <td>Militar</td>
            </tr>

            <tr>
                <td>João</td>
                <td>Masc</td>
                <td>21</td>
                <td>Programador</td>
            </tr>
            
            <tr>
                <td>Camile</td>
                <td>Fem</td>
                <td>19</td>
                <td>Militar</td>
            </tr>

            <tr>
                <td>Talita</td>
                <td>Fem</td>
                <td>47</td>
                <td>Professora</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
